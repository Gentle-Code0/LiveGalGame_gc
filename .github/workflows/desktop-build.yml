name: Web build and container

on:
  push:
    branches: [main, master, web-deploy]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm test
        working-directory: desktop
      - run: pnpm build
        working-directory: desktop
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:7456/api/health
      - if: always()
        run: docker compose logs && docker compose down
