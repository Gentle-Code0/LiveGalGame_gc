services:
  livegalgame:
    build: .
    ports:
      - "7456:7456"
    volumes:
      - livegalgame-data:/app/data
    environment:
      MEMORY_API_BASE_URL: ${MEMORY_API_BASE_URL:-}
    restart: unless-stopped
    init: true
    stop_grace_period: 95s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7456/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  livegalgame-data:
